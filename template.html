<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>成果物の名前</title>
<style>
/* ── 舞台：成果物の周りの枠だけ。成果物そのものの色・書体はここで決めない ── */
:root{
  --ji-stage:#f2f0eb; --ji-surface:#ffffff; --ji-ink:#1c1b19; --ji-sub:#6d6a63;
  --ji-line:#e3dfd6; --ji-accent:#c2410c; --ji-card:#fffdf8; --ji-card-ink:#2a2723;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ji-stage:#1b1a18; --ji-surface:#25231f; --ji-ink:#ece9e2; --ji-sub:#a29d93;
    --ji-line:#3a3731; --ji-accent:#fb923c; --ji-card:#2c2924; --ji-card-ink:#f1ede6;
  }
}
:root[data-theme="dark"]{
  --ji-stage:#1b1a18; --ji-surface:#25231f; --ji-ink:#ece9e2; --ji-sub:#a29d93;
  --ji-line:#3a3731; --ji-accent:#fb923c; --ji-card:#2c2924; --ji-card-ink:#f1ede6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ji-stage);color:var(--ji-ink);
  font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;-webkit-text-size-adjust:100%}
img{max-width:100%;height:auto}

/* スマホ画面：スマホでは全幅、PC では端末枠 */
.ji-phone{background:var(--ji-surface);min-height:100vh}
@media (min-width:600px){
  .ji-phone{width:390px;min-height:844px;margin:32px auto;border:10px solid #111;border-radius:44px;overflow:hidden}
}
/* メール：受信画面風 */
.ji-mail{max-width:720px;margin:0 auto;background:var(--ji-surface);min-height:100vh}
@media (min-width:600px){.ji-mail{margin:24px auto;min-height:0;border:1px solid var(--ji-line);border-radius:12px}}
.ji-mail-head{padding:20px 16px 12px;border-bottom:1px solid var(--ji-line)}
.ji-mail-subject{font-size:20px;font-weight:700;margin:0 0 12px;line-height:1.4}
.ji-mail-from{display:flex;gap:10px;align-items:center;font-size:14px}
.ji-mail-from small{display:block;color:var(--ji-sub)}
.ji-avatar{width:36px;height:36px;border-radius:50%;background:var(--ji-line);flex:none}
.ji-mail-body{padding:20px 16px 40px;font-size:16px;line-height:1.85;white-space:pre-wrap}
/* チャット・DM：吹き出し */
.ji-chat{max-width:480px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:100vh;background:var(--ji-surface)}
.ji-bubble{max-width:80%;padding:10px 14px;border-radius:18px;line-height:1.65;font-size:15px;white-space:pre-wrap;background:var(--ji-stage)}
.ji-bubble.me{align-self:flex-end;background:#3b82f6;color:#fff}
/* SNS 投稿 */
.ji-post{max-width:560px;margin:16px auto;background:var(--ji-surface);border:1px solid var(--ji-line);border-radius:16px;padding:16px}
.ji-post-body{font-size:16px;line-height:1.7;white-space:pre-wrap;margin:12px 0}
/* 文書：A4 の紙 */
.ji-paper{width:210mm;max-width:calc(100vw - 32px);min-height:297mm;margin:24px auto;padding:20mm;background:#fff;color:#111;
  box-shadow:0 1px 3px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.08)}
@media (max-width:600px){.ji-paper{min-height:0;padding:24px 16px}}
/* スライド：16:9 を縦に並べる */
.ji-slide{width:min(1280px,calc(100vw - 32px));aspect-ratio:16/9;margin:16px auto;background:#fff;color:#111;overflow:hidden;position:relative;
  box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* ── コメント・意図の操作部（2b ではここから下の style・ボタン・script を </body> 直前へ移す） ── */
#ji-layer{position:absolute;left:0;top:0;width:0;height:0;z-index:2147483000}
.ji-tools{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:2147483001;
  display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.ji-toggle{height:40px;padding:0 14px;border-radius:18px;border:1px solid var(--ji-line);background:var(--ji-card);color:var(--ji-sub);
  font:600 14px/1 "Hiragino Sans",system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.12);cursor:pointer;opacity:.85}
.ji-toggle[aria-pressed="true"]{background:var(--ji-accent);border-color:var(--ji-accent);color:#fff;opacity:1}
html.ji-cm-on [data-comment-target]{outline:2px solid color-mix(in srgb,#2563eb 55%,transparent);outline-offset:2px;cursor:pointer}
.ji-hint{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top));z-index:2147483001;padding:10px 14px;border-radius:10px;
  background:#2563eb;color:#fff;font:600 14px/1.5 "Hiragino Sans",system-ui,sans-serif;text-align:center}
html.ji-on [data-intent]{outline:1.5px dashed color-mix(in srgb,var(--ji-accent) 60%,transparent);outline-offset:3px}
.ji-dot{position:absolute;width:26px;height:26px;margin:0;padding:0;border:2px solid #fff;border-radius:50%;
  background:var(--ji-accent);color:#fff;font:700 14px/22px system-ui,sans-serif;text-align:center;cursor:pointer;
  box-shadow:0 1px 4px rgba(0,0,0,.25)}
.ji-card{position:absolute;width:min(320px,calc(100vw - 32px));padding:14px 16px 12px;border-radius:12px;
  background:var(--ji-card);color:var(--ji-card-ink);border:1px solid var(--ji-line);box-shadow:0 8px 28px rgba(0,0,0,.18);
  font:14px/1.7 "Hiragino Sans",system-ui,sans-serif}
.ji-card p{margin:0}
.ji-card-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.ji-card button{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--ji-line);background:transparent;color:inherit;font:inherit;font-size:14px;cursor:pointer}
.ji-card button.primary{background:var(--ji-accent);border-color:var(--ji-accent);color:#fff}
@media print{.ji-tools,#ji-layer,.ji-hint{display:none}}
</style>
</head>
<body>

<!-- ── 成果物：舞台クラスで包み、判断の入った箇所に data-intent、塊に data-comment-target ── -->
<main class="ji-mail">
  <header class="ji-mail-head">
    <h1 class="ji-mail-subject" data-comment-target
        data-intent="件名に日付を入れたのは、受信箱で他の案内と並んだときに「今週の話」だと一目で分かるようにするため。">【10/30】件名の例</h1>
    <div class="ji-mail-from"><span class="ji-avatar"></span><div>差出人の名前<small>宛先: あなた</small></div></div>
  </header>
  <div class="ji-mail-body" data-comment-target
       data-intent="最初の一文で用件を言い切った。挨拶から入ると、スマホのプレビューで用件が見えなくなるため。">本文の例。最初の一文で用件を言い切る。</div>
</main>

<div id="ji-layer" data-uncommentable></div>
<div class="ji-tools" data-uncommentable>
  <button class="ji-toggle ji-cm" type="button" aria-pressed="false" hidden>コメント</button>
  <button class="ji-toggle ji-it" type="button" aria-pressed="false">意図</button>
</div>
<script>
(() => {
  const html = document.documentElement;
  const layer = document.getElementById('ji-layer');
  const itBtn = document.querySelector('.ji-it');
  const cmBtn = document.querySelector('.ji-cm');

  // ── コメント：claude.ai のコメント機能（本人→Claude）。押してから塊をタップすると、その場で書ける ──
  let comments = null, cmOn = false, hint = null;
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('comments').then(c => { comments = c; cmBtn.hidden = false; }).catch(() => {});
  }
  function setCm(v) {
    cmOn = v; html.classList.toggle('ji-cm-on', cmOn); cmBtn.setAttribute('aria-pressed', String(cmOn));
    if (cmOn) { if (itOn) setIt(false); hint = document.createElement('div'); hint.className = 'ji-hint';
      hint.setAttribute('data-uncommentable', ''); hint.textContent = 'コメントしたい所をタップしてください'; document.body.append(hint); }
    else if (hint) { hint.remove(); hint = null; }
  }
  cmBtn.addEventListener('click', e => { e.stopPropagation(); setCm(!cmOn); });
  document.addEventListener('click', async e => {
    if (!cmOn || !comments) return;
    const el = e.target.closest('[data-comment-target]');
    if (!el || e.target.closest('[data-uncommentable]')) return;
    e.preventDefault(); e.stopPropagation();
    try { const r = await comments.openComposer({ element: el }); if (r && r.opened) setCm(false); } catch { setCm(false); }
  }, true);

  // ── 意図：作った時点の狙い（Claude→本人）。読むだけ。コメントとは別物 ──
  const targets = () => [...document.querySelectorAll('[data-intent]')].filter(el => !layer.contains(el));
  if (!targets().length) itBtn.hidden = true;
  let itOn = false, card = null, raf = 0;
  const viewW = () => html.clientWidth;
  function closeCard() { if (card) { card.remove(); card = null; } }
  function place() {
    layer.replaceChildren(); card = null;
    if (!itOn) return;
    targets().forEach((el, i) => {
      const r = el.getBoundingClientRect();
      if (!r.width && !r.height) return;
      const d = document.createElement('button');
      d.type = 'button'; d.className = 'ji-dot'; d.textContent = String(i + 1);
      d.setAttribute('aria-label', '意図 ' + (i + 1));
      d.style.left = Math.max(scrollX + 4, Math.min(r.right + scrollX - 12, scrollX + viewW() - 28)) + 'px';
      d.style.top = Math.max(r.top + scrollY - 12, scrollY + 4) + 'px';
      d.addEventListener('click', e => { e.stopPropagation(); show(el, d); });
      layer.append(d);
    });
  }
  function show(el, dot) {
    const wasSame = card && card.dataset.for === dot.textContent;
    closeCard();
    if (wasSame) return;
    card = document.createElement('div');
    card.className = 'ji-card'; card.dataset.for = dot.textContent;
    const p = document.createElement('p'); p.textContent = el.dataset.intent;
    const foot = document.createElement('div'); foot.className = 'ji-card-foot';
    const x = document.createElement('button');
    x.type = 'button'; x.textContent = '閉じる';
    x.addEventListener('click', e => { e.stopPropagation(); closeCard(); });
    foot.append(x);
    card.append(p, foot);
    card.addEventListener('click', e => e.stopPropagation());
    layer.append(card);
    const dl = parseFloat(dot.style.left), dt = parseFloat(dot.style.top);
    const w = card.offsetWidth;
    card.style.left = Math.max(scrollX + 16, Math.min(dl + 24 - w, scrollX + viewW() - 16 - w)) + 'px';
    card.style.top = (dt + 30) + 'px';
  }
  function setIt(v) {
    itOn = v;
    html.classList.toggle('ji-on', itOn);
    itBtn.setAttribute('aria-pressed', String(itOn));
    if (itOn && cmOn) setCm(false);
    try { localStorage.setItem('ji-intent', itOn ? '1' : '0'); } catch {}
    place();
  }
  const schedule = () => { if (!itOn) return; cancelAnimationFrame(raf); raf = requestAnimationFrame(place); };
  itBtn.addEventListener('click', e => { e.stopPropagation(); setIt(!itOn); });
  document.addEventListener('click', closeCard);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeCard(); setCm(false); } });
  addEventListener('resize', schedule);
  if ('ResizeObserver' in window) new ResizeObserver(schedule).observe(document.body);
  try { if (localStorage.getItem('ji-intent') === '1') setIt(true); } catch {}
})();
</script>
</body>
</html>
